[package]
name = "rustygit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A Rust reimplementation of git's core: object store, refs, index, plumbing and porcelain commands"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bsadashi/rustygit"
homepage = "https://github.com/bsadashi/rustygit"
documentation = "https://docs.rs/rustygit"
readme = "README.md"
keywords = ["git", "vcs", "version-control"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "/target",
    "/.github",
    "/POLISH.md",
    "/PROOF.md",
    "/NON_GOALS.md",
    "/TESTING.md",
    "/tests",
]

[[bin]]
name = "rustygit"
path = "src/main.rs"

[lib]
name = "rustygit"
path = "src/lib.rs"

[dependencies]
sha1 = "0.10"          # SHA-1 hashing primitive (objects/refs)
sha2 = "0.10"          # SHA-256 hashing for object-format=sha256 (M0 architectural readiness)
flate2 = "1"           # zlib compression for the loose object format
hex = "0.4"            # hex encoding for ObjectId Display/FromStr
clap = { version = "4", features = ["derive"] }  # CLI parsing; derive macros are non-negotiable
clap_complete = "4"    # shell-completion generation for the hidden `completions <shell>` subcommand (NON_GOALS B4)
clap_mangen = "0.2"    # man-page generation for the hidden `manpage` subcommand (NON_GOALS B4)
anyhow = "1"           # error wrapping at the binary boundary only (per ADR A5)
thiserror = "1"        # typed errors per module
bstr = "1"             # byte-string handling for paths/refs (UTF-8 not guaranteed)
memmap2 = "0.9"        # mmap pack files for zero-copy reads (M7+)
ureq = { version = "2", features = ["tls"] }  # sync HTTPS client for protocol-v2 (M10); chosen to avoid tokio (ADR A6)
tempfile = "3"         # tempdirs for gpg --verify scratch space + test isolation
ctrlc = "3"            # SIGINT handler for crash-safe lockfile cleanup (A9a)

[dev-dependencies]
assert_cmd = "2"       # run the compiled rustygit binary in tests
predicates = "3"       # used with assert_cmd for output assertions
libc = "0.2"           # `kill(2)` for SIGINT in tests/sigint_cleanup.rs

[profile.release]
lto = true
codegen-units = 1

# .deb packaging (cargo-deb). Built in release.yml after the per-target
# binary lands. `assets` lists every file shipped in the package; the
# pre-built binary is copied from $TARGET-musl/release/rustygit so
# cargo-deb's default-build step is bypassed via `--no-build`.
[package.metadata.deb]
maintainer = "rustygit maintainers <noreply@example.invalid>"
copyright = "2026, rustygit maintainers"
license-file = ["LICENSE-MIT", "0"]
extended-description = """\
A from-scratch Rust reimplementation of git's core. Object store, refs,
index, packfiles, plumbing and porcelain. Single binary, no shell scripts,
no Perl, no Tcl/Tk. Byte-for-byte oracle-compatible with upstream git for
the documented subcommand subset."""
depends = "$auto"
section = "vcs"
priority = "optional"
# Shell completions + man page are generated by `release.yml`'s
# "Generate completion + manpage artifacts" step BEFORE cargo-deb runs
# (it invokes the binary with `rustygit completions <shell>` /
# `rustygit manpage`). The paths below are the standard locations on
# Debian/Ubuntu: bash-completion under `/usr/share/bash-completion/...`,
# zsh under `/usr/share/zsh/site-functions/`, fish under
# `/usr/share/fish/vendor_completions.d/`, manpages gzipped under
# `/usr/share/man/man1/`. (NON_GOALS B4.)
assets = [
    ["target/release/rustygit", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/rustygit/README.md", "644"],
    ["COMPAT.md", "usr/share/doc/rustygit/COMPAT.md", "644"],
    ["target/artifacts/completions/rustygit.bash", "usr/share/bash-completion/completions/rustygit", "644"],
    ["target/artifacts/completions/_rustygit", "usr/share/zsh/site-functions/_rustygit", "644"],
    ["target/artifacts/completions/rustygit.fish", "usr/share/fish/vendor_completions.d/rustygit.fish", "644"],
    ["target/artifacts/man/rustygit.1.gz", "usr/share/man/man1/rustygit.1.gz", "644"],
]

# .rpm packaging (cargo-generate-rpm).
[package.metadata.generate-rpm]
# musl-static binary has no shared-library deps, so skip the ELF auto-scan
# step. This also prevents cargo-generate-rpm from trying to ELF-parse a
# Mach-O binary if anyone runs it on macOS by accident.
auto-req = "no"
# Same shell-completion + manpage layout as the .deb. The completions
# and gzipped manpage are pre-generated by `release.yml` BEFORE
# cargo-generate-rpm runs. (NON_GOALS B4.)
assets = [
    { source = "target/release/rustygit", dest = "/usr/bin/rustygit", mode = "0755" },
    { source = "README.md", dest = "/usr/share/doc/rustygit/README.md", mode = "0644", doc = true },
    { source = "COMPAT.md", dest = "/usr/share/doc/rustygit/COMPAT.md", mode = "0644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/rustygit/LICENSE-MIT", mode = "0644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/rustygit/LICENSE-APACHE", mode = "0644", doc = true },
    { source = "target/artifacts/completions/rustygit.bash", dest = "/usr/share/bash-completion/completions/rustygit", mode = "0644" },
    { source = "target/artifacts/completions/_rustygit", dest = "/usr/share/zsh/site-functions/_rustygit", mode = "0644" },
    { source = "target/artifacts/completions/rustygit.fish", dest = "/usr/share/fish/vendor_completions.d/rustygit.fish", mode = "0644" },
    { source = "target/artifacts/man/rustygit.1.gz", dest = "/usr/share/man/man1/rustygit.1.gz", mode = "0644", doc = true },
]
