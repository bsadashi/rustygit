name: Release

# Triggers on a tag like v0.1.0 / v1.0.0. Builds release binaries for six
# targets (Linux x86_64/aarch64 musl, macOS x86_64/aarch64, Windows
# x86_64/aarch64), produces a universal macOS binary via lipo, uploads
# them to the GitHub Release, and publishes to crates.io.
#
# Manual release: `git tag v0.1.0 && git push origin v0.1.0`.
#
# SECURITY POSTURE: the only untrusted-input field this workflow touches is
# `${{ github.ref_name }}`, which the `on.push.tags` filter constrains to
# the regex `v[0-9]+.[0-9]+.[0-9]+(-.*)?` — no shell-metacharacters can
# appear. `${{ github.repository }}` is always a safe `owner/repo` string.
# Even so, all `run:` blocks that use them go through `env:` with `"$VAR"`
# quoting per the official guide:
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            ext: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-13
            cross: false
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            ext: ".exe"
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            cross: false
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross (linux only)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev v0.2.5

      - name: Build (cross)
        if: matrix.cross
        env:
          TARGET: ${{ matrix.target }}
        run: cross build --release --target "$TARGET" --bin rustygit

      - name: Build (native — unix)
        if: ${{ !matrix.cross && runner.os != 'Windows' }}
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET" --bin rustygit

      # Windows uses pwsh, not bash. Env-var indirection is still safe.
      - name: Build (native — windows)
        if: ${{ !matrix.cross && runner.os == 'Windows' }}
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target $env:TARGET --bin rustygit

      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src="target/${TARGET}/release/rustygit${EXT}"
          out="dist/rustygit-${REF_NAME}-${TARGET}${EXT}"
          cp "$src" "$out"
          (cd dist && shasum -a 256 "rustygit-${REF_NAME}-${TARGET}${EXT}" > "rustygit-${REF_NAME}-${TARGET}${EXT}.sha256")

      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
          EXT: ${{ matrix.ext }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = "target/$env:TARGET/release/rustygit$env:EXT"
          $out = "dist/rustygit-$env:REF_NAME-$env:TARGET$env:EXT"
          Copy-Item $src $out
          $hash = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLower()
          $name = Split-Path $out -Leaf
          "$hash  $name" | Out-File -FilePath "$out.sha256" -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: rustygit-${{ matrix.target }}
          path: dist/
          retention-days: 7

  # Combine the two macOS slices into one universal binary (`lipo`).
  # Runs after both macOS targets land; uploads as a separate artifact.
  macos-universal:
    name: macos-universal
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: rustygit-*-apple-darwin
          path: macslices
          merge-multiple: true

      - name: lipo combine
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          x86="macslices/rustygit-${REF_NAME}-x86_64-apple-darwin"
          arm="macslices/rustygit-${REF_NAME}-aarch64-apple-darwin"
          out="dist/rustygit-${REF_NAME}-universal-apple-darwin"
          lipo -create "$x86" "$arm" -output "$out"
          chmod +x "$out"
          # Sanity: lipo -info should list both arches.
          lipo -info "$out"
          (cd dist && shasum -a 256 "rustygit-${REF_NAME}-universal-apple-darwin" > "rustygit-${REF_NAME}-universal-apple-darwin.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: rustygit-universal-apple-darwin
          path: dist/
          retention-days: 7

  publish:
    name: publish
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify version tag matches Cargo.toml
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          tag_ver="${REF_NAME#v}"
          if [ "$cargo_ver" != "$tag_ver" ]; then
            echo "tag $REF_NAME does not match Cargo.toml version $cargo_ver" >&2
            exit 1
          fi

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --no-verify
