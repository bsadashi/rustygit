# cargo-deny config — supply-chain & license policy.
# Run locally: cargo install cargo-deny; cargo deny check

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    # webpki-roots ships Mozilla's trust-anchor list under this license;
    # OSI-compatible, permissive — fine for binary redistribution.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # No legacy SSL stacks; we only ship ureq+rustls.
    { name = "openssl" },
    { name = "openssl-sys" },
    # No async runtime — ADR A6 forbids it.
    { name = "tokio" },
    { name = "async-std" },
]

[advisories]
yanked = "warn"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
